[project]
name = "certificate-watcher"
version = "1.1.0"
description = "Watch SSL/TLS certificates and alert if approaching expiration."
authors = [{ name = "Eric Dey"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0,<43",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://ericdey.com/"
Repository = "https://github.com/etdey/certificate-watcher"

[project.optional-dependencies]
dev = [
    "coverage>=7.16.0,<8",
    "flake8>=7.3.0,<8",
]

[project.scripts]
cert-watcher = "certificate_watcher.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
