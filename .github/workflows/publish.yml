#
# GitHub workflow to publish release artifacts for the project.
#
name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'

  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv tool
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run python -m unittest discover -v

      - name: Get project version from pyproject.toml
        id: prj-version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.prj-version.outputs.version }}
        run: |
          test -n "$RELEASE_TAG"
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Build wheel
        run: uv build --wheel

      - name: Publish release with wheel
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          name: v${{ steps.prj-version.outputs.version }}
          artifacts: dist/*.whl
          allowUpdates: true
          replacesArtifacts: false
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
